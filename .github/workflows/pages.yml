name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# `pages: write` permet à configure-pages d'activer Pages tout seul :
# aucun réglage manuel à faire dans Settings.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Activer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le site
        # Site statique sans build : la racine part telle quelle.
        # L'action exclut .git et .github d'elle-même.
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
